name: Build gallery

on:
  push:
    branches: [main]
    paths:
      - "assets/artworks/**"
      - "assets/about/**"
      - "tools/**"
      - "content.json"
      - "index.html"
      - "styles.css"
      - "script.js"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-gallery:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pillow
      - run: python tools/generate-artworks.py
      - name: Commit generated gallery files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update generated gallery
          file_pattern: artworks.json assets/artworks/thumbs
